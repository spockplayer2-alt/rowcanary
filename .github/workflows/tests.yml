name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install '.[test]'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test
        run: |
          python -m rowcanary demo
          python -m rowcanary make probe.csv
          python -m rowcanary check probe.csv
          rowcanary --version

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Install development tools
        run: python -m pip install '.[dev]'
      - name: Static analysis
        run: |
          python -m ruff check .
          python -m ruff format --check rowcanary tests tools
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          python tools/check_package.py dist
      - name: Test installed wheel outside the checkout
        run: |
          python -m venv /tmp/rowcanary-wheel
          /tmp/rowcanary-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/rowcanary-wheel/bin/python -m rowcanary demo
          /tmp/rowcanary-wheel/bin/rowcanary make probe.csv
          /tmp/rowcanary-wheel/bin/rowcanary check probe.csv

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install asset verification tools
        run: python -m pip install -r tools/requirements-assets.txt
      - name: Validate vectors and PNG exports
        run: python tools/check_assets.py
