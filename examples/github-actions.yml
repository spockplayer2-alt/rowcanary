name: Check exported controls
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # No PyPI release is assumed. Pin the reviewed RowCanary release.
      - run: python -m pip install https://github.com/spockplayer2-alt/rowcanary/releases/download/v1.0.0/rowcanary-1.0.0-py3-none-any.whl
      # Replace this synthetic fixture with controls exported by your own workflow.
      - run: python -m rowcanary check examples/compatibility/clean.csv --probe-set extended --json --report controls-report.json
